{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北商校園系統登入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@200..900&family=Noto+Serif+SC:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'login.css' %}" />
 
</head>
<body>
<div class="brand-bar">
    <img src="{% static 'imgs/校徽.png' %}" class="school-logo" alt="校徽">
    <div class="school-names">
        <h1 class="school-title-zh">國立臺北商業大學</h1>
        <h2 class="school-title-en">National Taipei University of Business</h2>
    </div>
</div>

<!-- 滿版學校背景與中央登入區塊 -->
<main class="login-page">
    <div class="login-form-card">
        <h2 class="login-title">北商校園系統登入</h2>
        
        {% if error %}
        <div style="color: #d93025; background-color: #fce8e6; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.95rem;">
            {{ error }}
        </div>
        {% endif %}

        <form id="loginForm" method="post" action="{% url 'login:login' %}">
            {% csrf_token %}
            <!-- 帳號輸入群組 -->
            <div class="input-group">
                <span class="input-icon"><img src="{% static 'imgs/person.png' %}" height="25" width="26" alt="帳號"></span>
                <label class="visually-hidden" for="account">帳號</label>
                <input id="account" name="account" type="text"
                       autocomplete="username" aria-label="帳號"
                       placeholder="帳號" required>
            </div>

            <!-- 密碼輸入群組 -->
            <div class="input-group">
                <span class="input-icon"><img src="{% static 'imgs/lock.png' %}" height="25" width="26" alt="密碼"></span>
                <label class="visually-hidden" for="password">密碼</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    aria-label="密碼"
                    placeholder="密碼"
                    minlength="8"
                    maxlength="50"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])[\S]{8,50}"
                    title="密碼需包含大寫、小寫英文字母及數字，長度至少 8 碼"
                    required
                >
            </div>

            <!-- 登入按鈕 -->
            <button type="submit" class="submit-btn">登入</button>
            <label class="remember-option">
                <input type="checkbox" id="rememberAccount" name="remember">
                <span>記住帳號</span>
            </label>
        </form>

        <!-- 💥 還沒有帳號？按此註冊 -->
        <div class="register-link-container">
            還沒有帳號？<a id="openRegisterModal">按此註冊</a>
        </div>
    </div>
</main>

<!-- 💥 註冊 Modal 彈出視窗 -->
<div class="modal-overlay" id="registerModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>建立新帳號</h3>
            <button type="button" class="close-btn" id="closeRegisterModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-error" id="registerError"></div>

            <!-- 註冊 Modal 彈窗區域內 -->
<form id="registerForm" action="{% url 'login:register' %}">
    {% csrf_token %}
    <div class="form-group">
        <label for="reg_username">帳號</label>
        <input type="text" id="reg_username" name="username" required placeholder="請設定登入帳號">
    </div>

    <!-- 💥 新增姓名欄位 -->
    <div class="form-group">
        <label for="reg_real_name">姓名</label>
        <input type="text" id="reg_real_name" name="real_name" required placeholder="請輸入真實姓名">
    </div>

    <div class="form-group">
        <label for="reg_role">身分</label>
        <select id="reg_role" name="role">
            <option value="student" selected>學生</option>
            <option value="teacher">老師</option>
        </select>
    </div>

    <!-- 💥 學生專用：學號欄位 -->
    <div class="form-group" id="studentIdGroup">
        <label for="reg_student_id">學號</label>
        <input type="text" id="reg_student_id" name="student_id" placeholder="請輸入學號">
    </div>

    <!-- 學生專用：班級選擇區塊 -->
    <div class="form-group" id="classGroup">
        <label for="reg_school_class">班級</label>
        <select id="reg_school_class" name="school_class">
            <option value="">請選擇班級</option>
            {% for sc in school_classes %}
                <option value="{{ sc.id }}">{{ sc.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="reg_password">密碼</label>
        <input type="password" id="reg_password" name="password" required placeholder="至少 8 碼英數字組合">
    </div>

    <div class="form-group">
        <label for="reg_password_confirm">確認密碼</label>
        <input type="password" id="reg_password_confirm" name="password_confirm" required placeholder="請再次輸入密碼">
    </div>

    <button type="submit" class="submit-btn" style="margin-top: 10px;">完成註冊</button>
</form>
        </div>
    </div>
</div>

<script src="{% static 'login.js' %}"></script>
</body>
</html>
