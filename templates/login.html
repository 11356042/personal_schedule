<link rel="stylesheet" href="../static/login.css" />
</head>
<body>
<div class="brand-bar">
    <img src="../static/imgs/校徽.png" class="school-logo" alt="校徽">
    <div class="school-names">
        <h1 class="school-title-zh">國立臺北商業大學</h1>
        <h2 class="school-title-en">National Taipei University of Business</h2>
    </div>
</div>
<!-- 滿版學校背景與中央登入區塊 -->
<main class="login-page">
    <div class="login-form-card">
        <h2 class="login-title">北商校園系統登入</h2>
        
        <form id="loginForm">
            <!-- 帳號輸入群組 -->
            <div class="input-group">
                <span class="input-icon"><img src = '../static/imgs/person.png' height="25" width="26"></span>
                <label class="visually-hidden" for="account">帳號</label>
                <input id="account" name="account" type="text"
                       autocomplete="username" aria-label="帳號"
                       placeholder="帳號" required>
            </div>

            <!-- 密碼輸入群組 -->
            <div class="input-group">
                <span class="input-icon"><img src = '../static/imgs/lock.png' height="25" width="26"></span>
                <label class="visually-hidden" for="password">密碼</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    aria-label="密碼"
                    placeholder="密碼"
                    minlength="8"
                    maxlength="50"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])[A-Za-z0-9]{3,8}"
                    title="密碼需包含大寫、小寫英文字母及數字，長度至少 8 碼"
                    required
                >
            </div>

            <!-- 登入按鈕 -->
            <button type="submit" class="submit-btn">登入</button>
            <label class="remember-option">
                <input type="checkbox" id="rememberAccount">
                <span>記住帳號</span>
            </label>
        </form>
    </div>
</main>

<script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const account = document.getElementById("account").value.trim();
        const password = document.getElementById("password").value;

        if (account === "" || password === "") {
            alert("請輸入帳號和密碼！");
            return;
        }

        // 必須有大寫、小寫英文字母及數字，長度 8 碼
        const passwordRule = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])[A-Za-z0-9]{8,50}$/;

        if (!passwordRule.test(password)) {
            alert("密碼必須包含大寫、小寫英文字母及數字，長度需要 8 碼以上！");
            return;
        }

        // 格式正確，將輸入的帳號與模擬學號存進瀏覽器暫存空間
         localStorage.setItem("loggedInAccount", account);
      localStorage.setItem("loggedInStudentID", account); 
      localStorage.setItem("loggedInClass", "資管一甲"); 

        // 成功後連動跳轉課表頁面 (請確保名稱為 timetable.html)
        window.location.href = "timetable.html";
    });
</script>

</body>
